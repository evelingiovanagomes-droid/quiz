<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Quiz Borabella</title><link rel="stylesheet" href="css/style.css"></head>
<body><main>
<header><span class="brand">Quiz <b>Borabella</b></span><div class="bar"><i id="prog"></i></div><span id="count"></span></header>
<section id="menu" hidden>
<h1>Conheça os produtos Borabella</h1>
<p class="hint">Aprenda o que cada produto faz, como usar, o que evitar e como ele é visualmente.</p>
<div class="modes">
<button class="mode" data-mode="all"><b>Quiz completo</b><span id="n-all"></span></button>
<button class="mode" data-mode="visual"><b>Reconhecer embalagens</b><span id="n-visual"></span></button>
<button class="mode" data-mode="know"><b>Benefícios, uso e cuidados</b><span id="n-know"></span></button>
</div></section>
<section id="quiz" hidden>
<span id="cat" class="tag"></span><h1 id="q"></h1>
<figure id="qimg" class="shot" hidden></figure>
<p class="hint" id="hint">Escolha a resposta certa</p>
<div class="cards" id="cards"></div>
<div id="reveal" class="reveal" hidden></div>
<button id="next" class="btn" disabled>Próxima pergunta</button>
</section>
<section id="end" hidden><h1>Você terminou!</h1><p id="score" class="big"></p><p id="msg"></p>
<div id="missed" hidden><h2>Revise estes produtos</h2><div id="missedGrid" class="grid"></div></div>
<button id="again" class="btn">Voltar ao início</button></section>
<section id="load"><p id="loadmsg">Carregando perguntas…</p>
<label id="pick" class="btn" hidden>Selecionar perguntas.csv e produtos.csv<input type="file" accept=".csv" multiple hidden></label></section>
</main><script src="data/perguntas.js"></script><script src="data/produtos.js"></script><script src="js/app.js"></script></body></html>
